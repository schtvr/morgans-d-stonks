services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PORTFOLIO_API_INTERNAL_URL: ${PORTFOLIO_API_INTERNAL_URL:-http://portfolio-api:8080}
    ports:
      - "3000:3000"
    environment:
      # Next rewrites /api-go/* to this URL (browser uses same-origin /api-go — no CORS for dashboard).
      PORTFOLIO_API_INTERNAL_URL: ${PORTFOLIO_API_INTERNAL_URL:-http://portfolio-api:8080}
      # Optional: set to call portfolio-api directly from the browser (then configure CORS + LAN URL).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      - portfolio-net
    depends_on:
      - portfolio-api

  portfolio-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BIN: portfolio-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:changeme@db:5432/portfolio?sslmode=disable}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-changeme}
      BROKER_PROVIDER: ${PORTFOLIO_BROKER_PROVIDER:-coinbase}
      BROKER_ENV: ${PORTFOLIO_BROKER_ENV:-paper}
      COINBASE_READ_API_KEY: ${COINBASE_READ_API_KEY:-}
      COINBASE_READ_API_SECRET: ${COINBASE_READ_API_SECRET:-}
      HTTP_ADDR: :8080
      # Origins allowed for browser requests (add http://<LAN-IP>:3000 for other devices on your network).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    networks:
      - portfolio-net
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BIN: ingest
    environment:
      BROKER_PROVIDER: ${INGEST_BROKER_PROVIDER:-coinbase}
      BROKER_ENV: ${INGEST_BROKER_ENV:-paper}
      COINBASE_READ_API_KEY: ${COINBASE_READ_API_KEY:-}
      COINBASE_READ_API_SECRET: ${COINBASE_READ_API_SECRET:-}
      INGEST_INTERVAL: ${INGEST_INTERVAL:-10m}
      PORTFOLIO_API_URL: ${PORTFOLIO_API_URL:-http://portfolio-api:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-changeme}
    networks:
      - portfolio-net
    depends_on:
      - portfolio-api
    restart: unless-stopped

  signals:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BIN: signals
    environment:
      SIGNAL_MOVE_THRESHOLD_PCT: ${SIGNAL_MOVE_THRESHOLD_PCT:-2.5}
      SIGNAL_COOLDOWN: ${SIGNAL_COOLDOWN:-1h}
      SIGNAL_INTERVAL: ${SIGNAL_INTERVAL:-5m}
      SIGNAL_STATE_PATH: ${SIGNAL_STATE_PATH:-/app/data/signal-state.json}
      SIGNAL_RULES_PATH: ${SIGNAL_RULES_PATH:-/app/config/signals.yaml}
      SIGNAL_RULE_DEDUP_PATH: ${SIGNAL_RULE_DEDUP_PATH:-/app/data/signal-rules-dedup.json}
      SIGNAL_RULE_COOLDOWN: ${SIGNAL_RULE_COOLDOWN:-24h}
      SIGNAL_AGENT_MAX_PER_SYMBOL_24H: ${SIGNAL_AGENT_MAX_PER_SYMBOL_24H:-2}
      COINBASE_READ_API_KEY: ${COINBASE_READ_API_KEY:-}
      COINBASE_READ_API_SECRET: ${COINBASE_READ_API_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-changeme}
      PORTFOLIO_API_URL: ${PORTFOLIO_API_URL:-http://portfolio-api:8080}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_DAILY_COST_CAP_USD: ${AGENT_DAILY_COST_CAP_USD:-5}
      AGENT_DAILY_TIMER_UTC: ${AGENT_DAILY_TIMER_UTC:-12:00}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-2}
      AGENT_PROMPT_PATH: ${AGENT_PROMPT_PATH:-config/agent-prompt.md}
    volumes:
      - signal_state:/app/data
      - ./config:/app/config:ro
    networks:
      - portfolio-net
    depends_on:
      - portfolio-api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    # No host port: Postgres is only reachable as db:5432 on portfolio-net (avoids binding host :5432).
    # For host tools: add e.g. "127.0.0.1:5433:5432" or run: docker compose exec db psql -U portfolio portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge

volumes:
  pgdata:
  signal_state:
