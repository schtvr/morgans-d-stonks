# Optional Coinbase paper execution. Merge with base compose to enable order execution.
# docker compose -f docker-compose.yml -f docker-compose.coinbase.yml up -d --build
#
# This override:
#   - Enables TRADING_ENABLED on portfolio-api and trading-worker
#   - Adds the trading-worker service
#   - Sets AGENT_TRADE_ENABLED=true on signals so agent decisions become orders
#
# Preflight: verify TRADING_ALLOWED_SYMBOLS, TRADING_MAX_NOTIONAL, AGENT_MIN_TRADE_CONFIDENCE
# before starting. Keep TRADING_KILL_SWITCH=true until you are ready.

services:
  portfolio-api:
    environment:
      BROKER_PROVIDER: coinbase
      BROKER_ENV: paper
      TRADING_ENABLED: "true"
      TRADING_KILL_SWITCH: "false"
      TRADING_ALLOWED_PROVIDERS: coinbase
      TRADING_ALLOWED_SYMBOLS: BTC-USD,ETH-USD
      TRADING_MAX_NOTIONAL: "1000"
      TRADING_RESERVE: "0"
      TRADING_GLOBAL_MAX_EXPOSURE: "5000"
      TRADING_SYMBOL_COOLDOWN: 5m

  signals:
    environment:
      AGENT_TRADE_ENABLED: "true"
      AGENT_MIN_TRADE_CONFIDENCE: ${AGENT_MIN_TRADE_CONFIDENCE:-0.70}
      AGENT_DEFAULT_TRADE_NOTIONAL: ${AGENT_DEFAULT_TRADE_NOTIONAL:-0}

  trading-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BIN: trading-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:changeme@db:5432/portfolio?sslmode=disable}
      BROKER_PROVIDER: coinbase
      BROKER_ENV: paper
      COINBASE_READ_API_KEY: ${COINBASE_READ_API_KEY:-}
      COINBASE_READ_API_SECRET: ${COINBASE_READ_API_SECRET:-}
      COINBASE_TRADE_API_KEY: ${COINBASE_TRADE_API_KEY:-}
      COINBASE_TRADE_API_SECRET: ${COINBASE_TRADE_API_SECRET:-}
      TRADING_ENABLED: "true"
      TRADING_KILL_SWITCH: "false"
      TRADING_MAX_NOTIONAL: "1000"
      TRADING_RESERVE: "0"
      TRADING_ALLOWED_PROVIDERS: coinbase
      TRADING_ALLOWED_SYMBOLS: BTC-USD,ETH-USD
      TRADING_DENIED_SYMBOLS: ${TRADING_DENIED_SYMBOLS:-}
      TRADING_GLOBAL_MAX_EXPOSURE: "5000"
      TRADING_SYMBOL_COOLDOWN: 5m
      TRADING_INTERVAL: 30s
    networks:
      - portfolio-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
